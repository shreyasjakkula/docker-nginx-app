name: Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-nginx-app:ci .

      - name: Run Docker container
        run: docker run -d --name test-nginx -p 8080:80 my-nginx-app:c1
        
